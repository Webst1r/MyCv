<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mthokozisi Masombuka - Data & Business Intelligence Analyst | AI & Cloud</title>
<meta name="description" content="BCom IT & Business Intelligence graduate (cum laude). AWS Certified Cloud Practitioner. Data, BI, Cloud and AI."/>
<meta name="theme-color" content="#0F2A47"/>
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png"/>
<link rel="apple-touch-icon" href="assets/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0F2A47;--navy-dark:#0A1D33;--steel:#2F6FA3;--steel-light:#5B94C4;
  --brass:#B08D57;--brass-light:#CDAE7B;
  --bg:#F4F6F9;--bg-alt:#E9EEF4;--card:#FFFFFF;--border:#D5DCE6;
  --ink:#1B2433;--body-col:#374357;--mid:#6B7A90;
}
html{scroll-behavior:smooth;}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg-alt);}::-webkit-scrollbar-thumb{background:var(--navy);border-radius:3px;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--steel);outline-offset:3px;}

/* NAV */
nav{position:fixed;top:0;width:100%;z-index:200;background:rgba(244,246,249,0.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);transition:box-shadow .3s;}
nav.scrolled{box-shadow:0 2px 24px rgba(15,42,71,.12);}
.nav-inner{max-width:1140px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;}
.nav-logo{font-family:"DM Serif Display",serif;font-size:1.3rem;color:var(--navy);text-decoration:none;}
.nav-links{display:flex;gap:1.8rem;list-style:none;align-items:center;}
.nav-links a{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--body-col);text-decoration:none;transition:color .2s;position:relative;}
.nav-links a::after{content:"";position:absolute;bottom:-3px;left:0;width:0;height:1.5px;background:var(--brass);transition:width .25s;}
.nav-links a:hover{color:var(--navy);}
.nav-links a:hover::after{width:100%;}
.nav-links a.nav-cv::after{display:none;}
.nav-cv{font-size:.73rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.5rem 1.2rem;background:var(--navy);color:#fff!important;border-radius:3px;transition:background .2s;}
.nav-cv:hover{background:var(--steel);}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px;}
.hamburger span{display:block;width:22px;height:1.5px;background:var(--ink);}
.mobile-menu{display:none;position:fixed;top:58px;left:0;width:100%;background:var(--bg);border-bottom:1px solid var(--border);z-index:199;flex-direction:column;padding:1.2rem 2rem;gap:1rem;}
.mobile-menu.open{display:flex;}
.mobile-menu a{font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;text-decoration:none;color:var(--body-col);}

/* HERO */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 340px;align-items:center;gap:5rem;max-width:1140px;margin:0 auto;padding:8rem 2rem 4rem;}
.hero-eyebrow{display:flex;align-items:center;gap:.8rem;margin-bottom:1.3rem;}
.eyebrow-line{width:36px;height:1.5px;background:var(--brass);}
.eyebrow-text{font-size:.72rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--brass);}
.hero h1{font-family:"DM Serif Display",serif;font-size:clamp(2.6rem,5vw,4rem);line-height:1.08;color:var(--navy);margin-bottom:.5rem;}
.hero-role{font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:1.4rem;}
.hero-rule{width:44px;height:2px;background:var(--brass);margin-bottom:1.5rem;border-radius:1px;}
.hero-desc{font-size:1rem;color:var(--body-col);max-width:520px;margin-bottom:2.2rem;font-weight:300;line-height:1.85;}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;}
.btn{display:inline-block;padding:.82rem 1.8rem;font-size:.77rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border-radius:3px;transition:all .22s;cursor:pointer;border:none;font-family:"DM Sans",sans-serif;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:var(--steel);transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,42,71,.25);}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
.btn-outline:hover{background:var(--navy);color:#fff;}
.btn-brass{background:var(--brass);color:#fff;}
.btn-brass:hover{background:var(--brass-light);transform:translateY(-2px);}

/* HERO PHOTO (solo portrait) */
.hero-visual{position:relative;display:flex;justify-content:center;align-items:center;}
.photo-ring{width:320px;height:320px;border-radius:50%;background:linear-gradient(145deg,var(--brass) 0%,var(--navy) 62%);padding:4px;position:relative;animation:float 7s ease-in-out infinite;}
.photo-ring::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(176,141,87,.35);}
.photo-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--navy);}
.photo-inner img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
.status-pill{position:absolute;bottom:12px;right:-16px;background:var(--card);border:1px solid var(--border);border-radius:50px;padding:.55rem 1rem;display:flex;align-items:center;gap:.5rem;font-size:.77rem;font-weight:600;box-shadow:0 4px 18px rgba(15,42,71,.1);white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;background:#22a06b;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.cert-pill{position:absolute;top:8px;left:-18px;background:var(--navy);color:#fff;border-radius:50px;padding:.5rem .9rem;font-size:.71rem;font-weight:700;box-shadow:0 4px 14px rgba(15,42,71,.3);}

/* SECTIONS */
.wrap{padding:6rem 2rem;}.wrap-alt{background:var(--bg-alt);}
.inner{max-width:1140px;margin:0 auto;}
.sh{margin-bottom:3.2rem;}
.sh-label{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:.45rem;}
.sh-title{font-family:"DM Serif Display",serif;font-size:clamp(1.8rem,3vw,2.5rem);color:var(--navy);line-height:1.1;}
.sh-rule{width:40px;height:2.5px;background:var(--brass);margin-top:.9rem;border-radius:1px;}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start;}
.about-p{font-size:.97rem;color:var(--body-col);margin-bottom:1.1rem;font-weight:300;line-height:1.85;}
.fact-stack{display:flex;flex-direction:column;gap:.65rem;}
.fact{display:grid;grid-template-columns:110px 1fr;gap:.8rem;padding:.85rem 1rem;background:var(--card);border-left:3px solid var(--steel);border-radius:0 4px 4px 0;box-shadow:0 1px 4px rgba(15,42,71,.06);}
.fact-k{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mid);padding-top:2px;}
.fact-v{font-size:.88rem;font-weight:500;color:var(--ink);}
.fact-v a{color:var(--steel);font-weight:600;text-decoration:none;}.fact-v a:hover{color:var(--brass);}

/* GALLERY SLIDESHOW */
.gallery{display:grid;grid-template-columns:minmax(0,430px) 1fr;gap:4rem;align-items:center;}
.stage{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--navy-dark);box-shadow:0 24px 60px rgba(15,42,71,.28);touch-action:pan-y;}
.stage::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);pointer-events:none;z-index:4;}
.g-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 0s linear 1.1s;}
.g-slide.active{opacity:1;visibility:visible;transition:opacity 1.1s ease;z-index:2;}
.g-slide img,.g-slide video{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02);}
.g-slide.active img{animation:kenburns 9s ease-out forwards;}
.g-slide:nth-child(even).active img{animation-name:kenburns2;}
@keyframes kenburns{from{transform:scale(1.02) translate(0,0);}to{transform:scale(1.14) translate(-2%,-2%);}}
@keyframes kenburns2{from{transform:scale(1.14) translate(2%,0);}to{transform:scale(1.02) translate(0,0);}}
.g-slide::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(to top,rgba(10,29,51,.82),transparent);}
.g-cap{position:absolute;left:1.4rem;right:1.4rem;bottom:1.5rem;z-index:3;color:#fff;opacity:0;transform:translateY(14px);transition:opacity .8s .5s,transform .8s .5s;}
.g-slide.active .g-cap{opacity:1;transform:none;}
.g-cap small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brass-light);margin-bottom:.2rem;}
.g-cap span{font-family:"DM Serif Display",serif;font-size:1.3rem;line-height:1.2;}
.progress{position:absolute;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--brass),var(--steel-light));z-index:6;}
.progress.run{animation:prog var(--dur,6000ms) linear forwards;}
.stage.paused .progress.run,.stage.paused .g-slide.active img{animation-play-state:paused;}
@keyframes prog{from{width:0;}to{width:100%;}}
.g-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(10,29,51,.45);backdrop-filter:blur(6px);color:#fff;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .25s,background .2s;}
.stage:hover .g-arrow,.g-arrow:focus-visible{opacity:1;}
.g-arrow:hover{background:var(--steel);}
.g-prev{left:.8rem;}.g-next{right:.8rem;}
.g-side h3{font-family:"DM Serif Display",serif;font-size:1.7rem;color:var(--navy);line-height:1.2;margin-bottom:.8rem;}
.g-side p{font-size:.96rem;color:var(--body-col);font-weight:300;line-height:1.85;margin-bottom:1.6rem;max-width:460px;}
.thumbs{display:flex;gap:.9rem;}
.thumb{width:74px;height:92px;border-radius:6px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;opacity:.55;transition:opacity .3s,border-color .3s,transform .3s;background:none;}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb:hover{opacity:.9;transform:translateY(-3px);}
.thumb.active{opacity:1;border-color:var(--brass);transform:translateY(-3px);}
.g-count{margin-top:1.4rem;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);}
.g-count b{color:var(--navy);}

/* SKILLS */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1.2rem;}
.skill-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:1.5rem;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;}
.skill-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--brass),var(--steel));transform:scaleX(0);transform-origin:left;transition:transform .3s;}
.skill-card:hover::before{transform:scaleX(1);}
.skill-card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(15,42,71,.1);}
.sk-icon,.cert-icon,.proj-icon{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;background:var(--navy);color:var(--brass-light);font-size:.78rem;font-weight:700;letter-spacing:.04em;margin-bottom:.9rem;}
.sk-title{font-size:.77rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--navy);margin-bottom:.7rem;}
.sk-list{list-style:none;}
.sk-list li{font-size:.86rem;color:var(--body-col);padding:.18rem 0;display:flex;align-items:baseline;gap:.4rem;}
.sk-list li::before{content:"—";color:var(--brass);font-size:.65rem;font-weight:700;}

/* CERTS */
.certs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.3rem;}
.cert-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:1.6rem;display:flex;align-items:flex-start;gap:1.1rem;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;}
.cert-card::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--steel);}
.cert-card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(15,42,71,.1);}
.cert-icon{flex-shrink:0;margin-bottom:0;}
.cert-name{font-size:.92rem;font-weight:700;color:var(--navy);margin-bottom:.25rem;line-height:1.3;}
.cert-org{font-size:.8rem;color:var(--mid);margin-bottom:.45rem;}
.cert-status{display:inline-block;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:.18rem .55rem;border-radius:3px;background:var(--bg-alt);color:var(--navy);}
.cert-status.gold{background:#F3EBDD;color:#8A6A38;}

.cert-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.3rem;margin-top:1.6rem;}
.cert-group{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:1.4rem 1.5rem;}
.cg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);}
.cg-head span{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--navy);}
.cg-head b{background:var(--navy);color:var(--brass-light);font-size:.72rem;min-width:26px;text-align:center;padding:.15rem .5rem;border-radius:20px;}
.cert-group ul{list-style:none;}
.cert-group li{font-size:.86rem;color:var(--body-col);padding:.22rem 0 .22rem 1rem;position:relative;}
.cert-group li::before{content:"\2713";color:var(--steel);position:absolute;left:0;font-size:.75rem;font-weight:700;}
.cert-foot{margin-top:1.6rem;font-size:.85rem;color:var(--mid);}
.cert-foot b{color:var(--navy);}

/* PROJECTS */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.4rem;}
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1.8rem;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;}
.proj-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(15,42,71,.12);}
.proj-title{font-family:"DM Serif Display",serif;font-size:1.25rem;color:var(--navy);margin-bottom:.3rem;line-height:1.25;}
.proj-tag{font-size:.8rem;color:var(--mid);margin-bottom:.9rem;}
.tag-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem;}
.tag{font-size:.68rem;font-weight:600;letter-spacing:.03em;background:var(--bg-alt);color:var(--navy);padding:.22rem .6rem;border-radius:20px;}
.proj-desc{font-size:.88rem;color:var(--body-col);font-weight:300;margin-bottom:1.2rem;flex:1;}
.proj-links a{font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);text-decoration:none;border-bottom:1.5px solid var(--brass);padding-bottom:2px;}
.proj-links a:hover{color:var(--steel);}

/* EXPERIENCE */
.timeline{position:relative;padding-left:2.2rem;}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--border);}
.tl-item{position:relative;padding-bottom:2.6rem;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;left:-2.2rem;top:6px;width:11px;height:11px;border-radius:50%;background:var(--brass);border:2px solid var(--bg);}
.tl-title{font-family:"DM Serif Display",serif;font-size:1.3rem;color:var(--navy);margin-bottom:.15rem;}
.tl-org{font-size:.85rem;font-weight:600;color:var(--steel);margin-bottom:.7rem;}
.tl-list{list-style:none;}
.tl-list li{font-size:.9rem;color:var(--body-col);padding:.2rem 0 .2rem 1rem;position:relative;font-weight:300;}
.tl-list li::before{content:"•";color:var(--brass);position:absolute;left:0;}

/* EDUCATION */
.edu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.4rem;}
.edu-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1.8rem;}
.edu-year{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);margin-bottom:.5rem;}
.edu-title{font-family:"DM Serif Display",serif;font-size:1.15rem;color:var(--navy);margin-bottom:.2rem;line-height:1.3;}
.edu-org{font-size:.83rem;color:var(--mid);margin-bottom:.7rem;}
.edu-desc{font-size:.87rem;color:var(--body-col);font-weight:300;line-height:1.7;}

/* CONTACT */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;}
.contact-list{display:flex;flex-direction:column;gap:1rem;}
.contact-item{display:flex;align-items:center;gap:1rem;padding:1rem;background:var(--card);border-radius:6px;border:1px solid var(--border);text-decoration:none;transition:transform .2s,box-shadow .2s;}
.contact-item:hover{transform:translateX(4px);box-shadow:0 6px 18px rgba(15,42,71,.1);}
.ci-icon{width:36px;height:36px;border-radius:8px;background:var(--navy);color:var(--brass-light);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;}
.ci-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mid);}
.ci-value{font-size:.92rem;font-weight:600;color:var(--ink);word-break:break-word;}
.form{display:flex;flex-direction:column;gap:1rem;}
.form input,.form textarea{width:100%;padding:.9rem 1rem;border:1px solid var(--border);border-radius:6px;font-family:"DM Sans",sans-serif;font-size:.88rem;background:var(--card);color:var(--ink);}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px rgba(47,111,163,.15);}
.form textarea{resize:vertical;min-height:120px;}
.form button{align-self:flex-start;}

/* FOOTER */
footer{background:var(--navy-dark);color:#fff;padding:3rem 2rem 2rem;}
.foot-inner{max-width:1140px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1.5rem;}
.foot-name{font-family:"DM Serif Display",serif;font-size:1.1rem;}
.foot-sub{font-size:.78rem;color:rgba(255,255,255,.6);margin-top:.2rem;}
.foot-links{display:flex;gap:1.5rem;list-style:none;flex-wrap:wrap;}
.foot-links a{font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75);text-decoration:none;}
.foot-links a:hover{color:var(--brass-light);}
.foot-copy{max-width:1140px;margin:2rem auto 0;font-size:.75rem;color:rgba(255,255,255,.45);text-align:center;border-top:1px solid rgba(255,255,255,.1);padding-top:1.5rem;}

.thumbs{flex-wrap:wrap;}
.thumb{width:64px!important;height:80px!important;position:relative;}
.thumb.vid::after{content:"\25B6";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;background:rgba(10,29,51,.35);}

/* WELCOME POP-UP */
.welcome{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:1.2rem;background:rgba(10,29,51,.72);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s;}
.welcome.show{opacity:1;visibility:visible;transition:opacity .45s ease;}
.w-card{position:relative;width:100%;max-width:400px;background:var(--card);border-radius:14px;padding:2.6rem 2rem 2rem;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4);transform:translateY(24px) scale(.92);transition:transform .6s cubic-bezier(.2,1.3,.4,1);}
.welcome.show .w-card{transform:none;}
.w-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:14px 14px 0 0;background:linear-gradient(90deg,var(--brass),var(--steel));}
.w-photo{width:128px;height:128px;border-radius:50%;margin:-5.2rem auto 1.1rem;padding:4px;background:linear-gradient(145deg,var(--brass),var(--navy));box-shadow:0 10px 30px rgba(15,42,71,.35);}
.w-photo img{width:100%;height:100%;border-radius:50
